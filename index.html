<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Агропромцифра, упоминания</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #dfe6ee;
    color: #1c2430;
    font: 14px/1.4 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  .appbar {
    height: 56px;
    background: #0b2a4a;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
  }
  .brand { font-weight: 700; }
  .theme {
    background: #16406e;
    border-radius: 4px;
    padding: 6px 10px;
  }
  .limit {
    color: #c5d4e4;
    font-size: 12px;
    max-width: 420px;
  }
  .search {
    margin-left: auto;
    width: min(320px, 46vw);
    border: 1px solid #c5d0dc;
    border-radius: 4px;
    padding: 7px 10px;
    background: #fff;
    color: #1c2430;
  }
  .search:focus { outline: 2px solid #0e4d8b; border-color: #0e4d8b; }
  .app {
    display: grid;
    grid-template-columns: 216px minmax(0, 1fr) 248px;
    min-height: calc(100vh - 52px);
  }
  .nav, .filters { padding: 12px 8px; }
  .nav { background: #0b2a4a; color: #d6e2ee; }
  .nav h2 { color: #8eabc4; }
  .nav button { color: #d6e2ee; }
  .nav button.is-on {
    background: #16406e;
    color: #fff;
    font-weight: 650;
    box-shadow: inset 3px 0 0 #7eb6ea;
  }
  .filters { background: #fff; border-left: 1px solid #d5dde6; }
  .filters { border-left: 1px solid #d5dde6; }
  .nav h2, .filters h2 {
    margin: 8px 8px 6px;
    font-size: 12px;
    font-weight: 650;
  }
  .nav h2 { color: #8eabc4; }
  .filters h2 { color: #5c6b7a; }
  .nav button, .filters button, .index {
    display: flex;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .mix { display: flex; height: 28px; margin: 0 0 12px; background: #fff; border: 1px solid #d5dde6; overflow: hidden; }
  .mix-seg { min-width: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; white-space: nowrap; overflow: hidden; }
  .rules { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .rules button { border: 1px solid #0e4d8b; background: #f3f8fd; color: #0e4d8b; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  .main { padding: 12px 16px 28px; min-width: 0; }
  .indexes {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }
  .index {
    background: #fff;
    border: 1px solid #d5dde6;
    display: block;
    text-align: left;
  }
  .index b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .index span { color: #5c6b7a; font-size: 12px; }
  .index.is-on { border-color: #0e4d8b; background: #f3f8fd; }
  .note { margin: 0 0 8px; color: #5c6b7a; font-size: 12px; }
  .panel { background: #fff; border: 1px solid #d5dde6; }
  .msg {
    display: grid;
    grid-template-columns: 4px 1fr auto;
    gap: 12px;
    padding: 12px 12px 12px 0;
    border-bottom: 1px solid #e6ebf0;
    color: inherit;
    text-decoration: none;
  }
  .msg:hover { background: #f7fafc; }
  .bar { background: #c5ced6; }
  .msg h3 { margin: 0 0 2px; font-size: 15px; font-weight: 650; }
  .meta { color: #5c6b7a; font-size: 12px; }
  .frag { margin: 6px 0 0; }
  .page { margin: 4px 0 0; color: #334155; }
  .open { color: #0e4d8b; font-size: 13px; white-space: nowrap; align-self: start; }
  .filters button { justify-content: space-between; gap: 8px; }
  .filters button.is-on { background: #e7f0fa; color: #0e4d8b; font-weight: 650; }
  .filters .n { color: #5c6b7a; font-variant-numeric: tabular-nums; }
  .reset { margin: 8px; color: #0e4d8b; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e6ebf0; }
  th { color: #5c6b7a; font-weight: 650; font-size: 12px; }
  tr.pick { cursor: pointer; }
  tr.pick:hover { background: #f7fafc; }
  .empty { color: #5c6b7a; padding: 24px 12px; }
  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    .nav, .filters { border: 0; }
    .indexes { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">Упоминания</div>
  <div class="theme">Агропромцифра</div>
  <div class="limit" id="limit"></div>
  <input class="search" id="q" type="search" placeholder="Поиск по сообщениям" aria-label="Поиск по сообщениям">
</header>
<div class="app">
  <nav class="nav" aria-label="Отчеты">
    <h2>Тема</h2>
    <button type="button" id="nav-summary">Сводный отчет</button>
    <button type="button" id="nav-sources">Источники</button>
    <button type="button" id="nav-tags">Теги</button>
  </nav>
  <main class="main">
    <div class="indexes">
      <button class="index" id="idx-all" type="button"><b id="n-total">0</b><span>сообщения</span></button>
      <button class="index" id="idx-about" type="button"><b id="n-about">0</b><span>о нас написали</span></button>
      <button class="index" id="idx-site" type="button"><b id="n-site">0</b><span>страницы своего сайта</span></button>
      <button class="index" id="idx-tg" type="button"><b id="n-tg">0</b><span>свой Telegram</span></button>
    </div>
    <div class="mix" id="mix"></div>
    <div class="rules" id="rules"></div>
    <p class="note" id="sort"></p>
    <div id="list"></div>
  </main>
  <aside class="filters" aria-label="Фильтры">
    <h2>Фильтры</h2>
    <div id="filters"></div>
    <button class="reset" id="reset" type="button" hidden>Сбросить фильтры</button>
  </aside>
</div>
<script src="data/mentions.js"></script>
<script>
window.__cabinetErrors = [];
window.addEventListener("error", function (event) {
  window.__cabinetErrors.push(String(event.message || "error"));
});
var FILTERS = ["Вся лента", "О нас написали", "СМИ", "Документ", "Карточка", "Вакансия и отзыв", "Соцсеть", "Свой сайт"];
var current = "Вся лента";
var q = "";
var screen = "summary";
var hostFilter = "";
var themeFilter = "";
var statusFilter = "";

function items() {
  return Array.isArray(window.MENTIONS) ? window.MENTIONS : [];
}

function host(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); }
  catch (e) { return ""; }
}

function safeUrl(url) {
  return /^https?:\/\//i.test(url || "") ? url : "#";
}

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function textHit(item) {
  if (!q) return true;
  var hay = [item.title, item.frag, item.pullText, item.type, item.key, item.theme, host(item.url)].join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}

function extraHit(item) {
  if (hostFilter && host(item.url) !== hostFilter) return false;
  if (themeFilter && item.theme !== themeFilter) return false;
  if (statusFilter && item.linkStatus !== statusFilter) return false;
  return true;
}

function typeHit(item) {
  if (current === "Вся лента") return true;
  if (current === "О нас написали") return !item.own;
  return item.type === current;
}

function tally(rows) {
  var about = 0;
  var ownSite = 0;
  var ownTg = 0;
  rows.forEach(function (item) {
    if (item.type === "Свой сайт") ownSite += 1;
    if (item.own && item.type === "Соцсеть") ownTg += 1;
    if (!item.own) about += 1;
  });
  return { about: about, ownSite: ownSite, ownTg: ownTg, total: rows.length };
}

function groups(rows, field, labelOf) {
  var map = {};
  rows.forEach(function (item) {
    var key = labelOf(item) || "не размечено";
    map[key] = (map[key] || 0) + 1;
  });
  return Object.keys(map).map(function (key) {
    return { key: key, n: map[key] };
  }).sort(function (a, b) {
    if (b.n !== a.n) return b.n - a.n;
    return a.key.localeCompare(b.key, "ru");
  });
}

function pool() {
  return items().filter(function (item) {
    return textHit(item) && extraHit(item);
  });
}

function visible() {
  return pool().filter(typeHit);
}

function setScreen(name) {
  screen = name;
  render();
}

function renderNav() {
  document.getElementById("nav-summary").className = screen === "summary" ? "is-on" : "";
  document.getElementById("nav-sources").className = screen === "sources" ? "is-on" : "";
  document.getElementById("nav-tags").className = screen === "tags" ? "is-on" : "";
  document.getElementById("idx-all").className = "index" + (current === "Вся лента" && !hostFilter && !themeFilter && !statusFilter ? " is-on" : "");
  document.getElementById("idx-about").className = "index" + (current === "О нас написали" ? " is-on" : "");
  document.getElementById("idx-site").className = "index" + (current === "Свой сайт" ? " is-on" : "");
  document.getElementById("idx-tg").className = "index" + (current === "Соцсеть" ? " is-on" : "");
}

function filterButton(label, count, on, action) {
  var b = document.createElement("button");
  b.type = "button";
  b.className = on ? "is-on" : "";
  b.innerHTML = "<span>" + esc(label) + "</span><span class=\"n\">" + esc(count) + "</span>";
  b.addEventListener("click", action);
  return b;
}

function renderFilters(rows) {
  var box = document.getElementById("filters");
  box.innerHTML = "";
  var slices = ["Вся лента", "О нас написали"];
  slices.forEach(function (name) {
    var n = name === "Вся лента" ? rows.length : rows.filter(function (item) { return !item.own; }).length;
    box.appendChild(filterButton(name, n, current === name && !hostFilter && !themeFilter && !statusFilter, function () {
      current = name;
      hostFilter = "";
      themeFilter = "";
      statusFilter = "";
      screen = "summary";
      render();
    }));
  });
  var typeTitle = document.createElement("h2");
  typeTitle.textContent = "Тип сообщения";
  box.appendChild(typeTitle);
  FILTERS.slice(2).forEach(function (name) {
    var n = rows.filter(function (item) { return item.type === name; }).length;
    box.appendChild(filterButton(name, n, current === name, function () {
      current = name;
      screen = "summary";
      render();
    }));
  });
  var statusTitle = document.createElement("h2");
  statusTitle.textContent = "Ссылка";
  box.appendChild(statusTitle);
  groups(rows, "linkStatus", function (item) { return item.linkStatus; }).forEach(function (row) {
    box.appendChild(filterButton(row.key, row.n, statusFilter === row.key, function () {
      statusFilter = statusFilter === row.key ? "" : row.key;
      screen = "summary";
      render();
    }));
  });
  var dirty = current !== "Вся лента" || hostFilter || themeFilter || statusFilter || q;
  document.getElementById("reset").hidden = !dirty;
}

var MIX = {
  "СМИ": "#0e4d8b",
  "Документ": "#3d6b4f",
  "Карточка": "#8a5a12",
  "Вакансия и отзыв": "#6b3f73",
  "Соцсеть": "#1d6f8a",
  "Свой сайт": "#35506e"
};

function renderMix(all) {
  var box = document.getElementById("mix");
  var total = all.length || 1;
  box.innerHTML = groups(all, "type", function (item) { return item.type; }).map(function (row) {
    var width = Math.max(8, Math.round(row.n / total * 100));
    return '<div class="mix-seg" style="width:' + width + '%;background:' + (MIX[row.key] || "#5c6b7a") + '">' + esc(row.key) + " " + row.n + "</div>";
  }).join("");
}

function ruleButton(label, clear) {
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.addEventListener("click", function () {
    clear();
    render();
  });
  return b;
}

function renderRules() {
  var box = document.getElementById("rules");
  box.innerHTML = "";
  if (q) box.appendChild(ruleButton("поиск: " + q, function () { q = ""; document.getElementById("q").value = ""; }));
  if (hostFilter) box.appendChild(ruleButton("источник: " + hostFilter, function () { hostFilter = ""; }));
  if (themeFilter) box.appendChild(ruleButton("тема: " + themeFilter, function () { themeFilter = ""; }));
  if (statusFilter) box.appendChild(ruleButton("ссылка: " + statusFilter, function () { statusFilter = ""; }));
  if (current !== "Вся лента") box.appendChild(ruleButton(current, function () { current = "Вся лента"; }));
}

function sliceLine(rows) {
  return "Показано " + rows.length + " из " + items().length + ". Порядок сбора, не календарь публикаций.";
}

function renderFeed(rows) {
  var list = document.getElementById("list");
  document.getElementById("sort").textContent = sliceLine(rows);
  if (!items().length) {
    list.innerHTML = '<p class="empty">Сбор не подключился. Файл data/mentions.js не загрузился.</p>';
    return;
  }
  if (!rows.length) {
    list.innerHTML = '<p class="empty">В этом срезе пусто. Снимите одно правило над лентой.</p>';
    return;
  }
  list.innerHTML = '<div class="panel">' + rows.map(function (item) {
    var page = item.pullText
      ? '<p class="page">' + esc(item.pullText) + '</p>'
      : '<p class="page">Текст со страницы не снят. ' + esc(item.linkReason || "") + '</p>';
    return '<a class="msg" href="' + esc(safeUrl(item.url)) + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="bar"></span><div><h3>' + esc(item.title) + '</h3>' +
      '<div class="meta">' + esc(host(item.url)) + '  ' + esc(item.date) + '  ' + esc(item.type) + '  ' + esc(item.linkStatus || "") + '</div>' +
      '<p class="frag">' + esc(item.frag) + '</p>' + page +
      '</div><span class="open">Открыть</span></a>';
  }).join("") + "</div>";
}

function renderTable(title, rowsData, onPick) {
  var list = document.getElementById("list");
  document.getElementById("sort").textContent = title;
  if (!rowsData.length) {
    list.innerHTML = '<p class="empty">В этом срезе пусто.</p>';
    return;
  }
  var body = rowsData.map(function (row, index) {
    return '<tr class="pick" data-i="' + index + '"><td>' + esc(row.key) + '</td><td>' + esc(row.n) + '</td></tr>';
  }).join("");
  list.innerHTML = '<div class="panel"><table><thead><tr><th>Название</th><th>Сообщений</th></tr></thead><tbody>' + body + '</tbody></table></div>';
  list.querySelectorAll("tr.pick").forEach(function (tr) {
    tr.addEventListener("click", function () {
      onPick(rowsData[Number(tr.getAttribute("data-i"))]);
    });
  });
}

function renderTagTables(rows) {
  var list = document.getElementById("list");
  document.getElementById("sort").textContent = "Теги. Клик по строке сужает ленту сводного отчета.";
  var types = groups(rows, "type", function (item) { return item.type; });
  var themes = groups(rows, "theme", function (item) { return item.theme; });
  function table(caption, data, kind) {
    var body = data.map(function (row, index) {
      return '<tr class="pick" data-kind="' + kind + '" data-i="' + index + '"><td>' + esc(row.key) + '</td><td>' + esc(row.n) + '</td></tr>';
    }).join("");
    return '<h2 class="note">' + esc(caption) + '</h2><div class="panel"><table><thead><tr><th>Название</th><th>Сообщений</th></tr></thead><tbody>' + body + '</tbody></table></div>';
  }
  list.innerHTML = table("Тип сообщения", types, "type") + table("Тема", themes, "theme");
  list.querySelectorAll("tr.pick").forEach(function (tr) {
    tr.addEventListener("click", function () {
      var index = Number(tr.getAttribute("data-i"));
      var row = tr.getAttribute("data-kind") === "theme" ? themes[index] : types[index];
      if (tr.getAttribute("data-kind") === "theme") themeFilter = row.key;
      else current = row.key;
      screen = "summary";
      render();
    });
  });
}

function render() {
  var all = items();
  var numbers = tally(all);
  document.getElementById("n-total").textContent = String(numbers.total);
  document.getElementById("n-about").textContent = String(numbers.about);
  document.getElementById("n-site").textContent = String(numbers.ownSite);
  document.getElementById("n-tg").textContent = String(numbers.ownTg);
  document.getElementById("limit").textContent = "В ленте " + all.length + " записей ручного сбора. Это не полный медиапоток.";
  renderMix(all);
  renderRules();
  renderNav();
  var narrowed = pool();
  renderFilters(narrowed);
  var rows = visible();
  if (screen === "sources") {
    renderTable("Источники. Клик по строке открывает эти сообщения в сводном отчете.", groups(rows, "host", function (item) { return host(item.url); }), function (row) {
      hostFilter = row.key;
      screen = "summary";
      render();
    });
    return;
  }
  if (screen === "tags") {
    renderTagTables(rows);
    return;
  }
  renderFeed(rows);
}

document.getElementById("q").addEventListener("input", function (e) {
  q = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById("nav-summary").addEventListener("click", function () { setScreen("summary"); });
document.getElementById("nav-sources").addEventListener("click", function () { setScreen("sources"); });
document.getElementById("nav-tags").addEventListener("click", function () { setScreen("tags"); });
document.getElementById("idx-all").addEventListener("click", function () {
  current = "Вся лента";
  hostFilter = "";
  themeFilter = "";
  statusFilter = "";
  screen = "summary";
  render();
});
document.getElementById("idx-about").addEventListener("click", function () {
  current = "О нас написали";
  screen = "summary";
  render();
});
document.getElementById("idx-site").addEventListener("click", function () {
  current = "Свой сайт";
  screen = "summary";
  render();
});
document.getElementById("idx-tg").addEventListener("click", function () {
  current = "Соцсеть";
  screen = "summary";
  render();
});
document.getElementById("reset").addEventListener("click", function () {
  current = "Вся лента";
  q = "";
  hostFilter = "";
  themeFilter = "";
  statusFilter = "";
  screen = "summary";
  document.getElementById("q").value = "";
  render();
});

render();
</script>
</body>
</html>
